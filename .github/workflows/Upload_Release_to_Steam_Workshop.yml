name: Upload Release to Steam Workshop

permissions:
  contents: read

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (valfri). Tom = nyaste release"
        required: false
        type: string

jobs:
  upload_workshop:
    runs-on: ubuntu-latest

    concurrency:
      group: steam-upload
      cancel-in-progress: false

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          mkdir -p release_files/TLD_Nynorsk
          cd release_files

          # Vel tag basert på trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              TAG="${{ inputs.tag }}"
              echo "Manuell køyring: brukar tag $TAG"
              gh release download "$TAG"
            else
              echo "Manuell køyring utan tag: brukar latest release"
              gh release download --latest
            fi
          else
            echo "Automatisk køyring frå release event"
            gh release download "${{ github.event.release.tag_name }}"
          fi

          echo "Innhald etter nedlasting:"
          find . -type f

      - name: Validate required files
        run: |
          set -e

          REQUIRED_FILES=(
            "TLD_Nynorsk.csv"
            "TLD_Nynorsk_Bilete.png"
            "Workshop_TLD_Nynorsk.vdf"
          )

          echo "Sjekkar at alle nødvendige filer finst..."

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "release_files/$file" ] && [ ! -f "release_files/TLD_Nynorsk/$file" ]; then
              echo "Manglar påkravd fil: $file"
              exit 1
            fi
          done

          echo "Alle nødvendige filer er til stades"

      - name: Move files into correct structure
        run: |
          set -e
          
          mv release_files/TLD_Nynorsk.csv release_files/TLD_Nynorsk/TLD_Nynorsk.csv || true

          echo "Final structure:"
          find release_files -type f

      - name: Install SteamCMD
        run: |
          set -e
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6 wget unzip
          wget https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          mkdir -p ~/steamcmd
          tar -xvzf steamcmd_linux.tar.gz -C ~/steamcmd
          echo "$HOME/steamcmd" >> $GITHUB_PATH

      - name: Upload to Steam Workshop
        run: |
          set -e
          steamcmd.sh +login ${{ secrets.STEAM_USERNAME }} ${{ secrets.STEAM_PASSWORD }} \
                      +workshop_build_item "$(pwd)/release_files/Workshop_TLD_Nynorsk.vdf" +quit
